services:
  robot-fastapi:
    image: robot-fastapi:latest
    build: .
    container_name: robot-project1
    env_file:
      - ../my-next-app/.env.local
    restart: unless-stopped
    # Preserve the existing Docker Desktop API-to-host connection.
    ports:
      - "8000:8000"
    environment:
      ROBOT_BACKEND: rosbridge
      ROSBRIDGE_URL: ws://host.docker.internal:9090
      ROSBRIDGE_TIMEOUT: "8"
      ROBOT_SERVICE_NS: ${ROBOT_SERVICE_NS:-/dsr01/dsr_controller2}
      ROBOT_TELEMETRY_PERIOD: ${ROBOT_TELEMETRY_PERIOD:-0.1}
      BOX_API_URL: http://host.docker.internal:8765
      BOX_API_TIMEOUT: "8"
      BOX_START_TOKEN: ${BOX_START_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  log-sync:
    image: robot-fastapi:latest
    container_name: robot-log-sync
    restart: unless-stopped
    user: "${LOG_SYNC_UID:-1000}:${LOG_SYNC_GID:-1000}"
    env_file:
      - ../my-next-app/.env.local
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${BOX_LOG_DIR:-${HOME}/box_logs}:/logs
      - ../box_database/box_database/log_sync.py:/sync/log_sync.py:ro
    command: ["python", "/sync/log_sync.py", "--folder", "/logs"]
