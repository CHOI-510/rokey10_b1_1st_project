services:
  robot-fastapi:
    image: robot-fastapi:latest
    build: .
    container_name: robot-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ROBOT_BACKEND: rosbridge
      ROSBRIDGE_URL: ws://host.docker.internal:9090
      ROSBRIDGE_TIMEOUT: "8"
      BOX_API_URL: http://host.docker.internal:8765
      BOX_API_TIMEOUT: "8"
      BOX_START_TOKEN: ${BOX_START_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
